<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- Easy Listing app icon: a barcode of five bold bars on cream, the middle one
     in clay.
     Five thick bars rather than the realistic seven-plus of a real barcode: at
     29px (Spotlight, Settings) alternating thin bars merge into a striped
     smudge, and that size is where the icon spends most of its life. The accent
     bar is what stops it reading as a generic utility mark.
     Flat, no gradient - the previous plum-to-near-black fade went muddy small.
     Regenerate the appiconset after editing (see README / docs/STATUS.md): the
     JPEG hop in that pipeline is what strips the alpha channel the App Store
     rejects. Check with `sips -g hasAlpha`; it must read `no`. -->
<rect width="1024" height="1024" fill="#F7F3EA"/>
<rect x="216" y="232" width="88" height="560" rx="26" fill="#1C1B22"/>
<rect x="342" y="232" width="88" height="560" rx="26" fill="#1C1B22"/>
<rect x="468" y="232" width="88" height="560" rx="26" fill="#C2551F"/>
<rect x="594" y="232" width="88" height="560" rx="26" fill="#1C1B22"/>
<rect x="720" y="232" width="88" height="560" rx="26" fill="#1C1B22"/>
</svg>

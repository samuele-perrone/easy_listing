name: EasyListing
options:
  bundleIdPrefix: com.samperrone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  EasyListing:
    type: application
    platform: iOS
    sources: [EasyListing]
    info:
      path: EasyListing/Info.plist
      properties:
        CFBundleDisplayName: Easy Listing
        UILaunchScreen: {}
        NSCameraUsageDescription: Take photos of the item you want to sell.
        NSPhotoLibraryUsageDescription: Pick photos of the item you want to sell.
        # Camera shots are copied to your library so you can upload them to
        # Vinted, Gumtree and Facebook, which have no API and need a manual upload.
        NSPhotoLibraryAddUsageDescription: Save the photos you take to your camera roll, so you can upload them to the other marketplaces.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [easylisting]
        LSApplicationQueriesSchemes: [vinted, fb, gumtree, ebay]
        # Declares no non-exempt encryption, so App Store Connect stops asking
        # about export compliance on every upload.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: EasyListing/EasyListing.entitlements
      properties:
        # Sign in with Apple. The capability also has to be enabled on the App
        # ID in the developer portal, or signing fails with a provisioning
        # profile that doesn't carry the entitlement.
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samperrone.easylisting
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7RYYQ8M5X5

  EasyListingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EasyListingTests]
    dependencies:
      - target: EasyListing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samperrone.easylisting.tests
        DEVELOPMENT_TEAM: 7RYYQ8M5X5
        GENERATE_INFOPLIST_FILE: YES

  # Drives the app to capture App Store screenshots. Separate from the unit
  # tests so `xcodebuild test` doesn't boot a simulator UI on every run.
  EasyListingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [EasyListingUITests]
    dependencies:
      - target: EasyListing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samperrone.easylisting.uitests
        DEVELOPMENT_TEAM: 7RYYQ8M5X5
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EasyListing:
    build:
      targets:
        EasyListing: all
        EasyListingTests: [test]
    test:
      targets: [EasyListingTests]

  Screenshots:
    build:
      targets:
        EasyListing: all
        EasyListingUITests: [test]
    test:
      targets: [EasyListingUITests]

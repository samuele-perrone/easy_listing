name: EasyListing
options:
  bundleIdPrefix: com.samperrone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  EasyListing:
    type: application
    platform: iOS
    sources: [EasyListing]
    info:
      path: EasyListing/Info.plist
      properties:
        CFBundleDisplayName: Easy Listing
        UILaunchScreen: {}
        NSCameraUsageDescription: Take photos of the item you want to sell.
        NSPhotoLibraryUsageDescription: Pick photos of the item you want to sell.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [easylisting]
        LSApplicationQueriesSchemes: [vinted, fb, gumtree, ebay]
        # Declares no non-exempt encryption, so App Store Connect stops asking
        # about export compliance on every upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samperrone.easylisting
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7RYYQ8M5X5

  EasyListingTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EasyListingTests]
    dependencies:
      - target: EasyListing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samperrone.easylisting.tests
        DEVELOPMENT_TEAM: 7RYYQ8M5X5
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EasyListing:
    build:
      targets:
        EasyListing: all
        EasyListingTests: [test]
    test:
      targets: [EasyListingTests]
